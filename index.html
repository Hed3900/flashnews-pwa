<!DOCTYPE html>
<html>
<head>
  <meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  overflow: hidden;
}

.container {
  display: flex;
  overflow-x: scroll;
  height: 100vh;
  scroll-snap-type: x mandatory;
}

.card {
  min-width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 20px;
  box-sizing: border-box;
  scroll-snap-align: start;
  background-size: cover;
  background-position: center;
}

.overlay {
  background: linear-gradient(transparent, black);
  padding: 20px;
  border-radius: 10px;
}

h2 { font-size: 22px; }
p { color: #ccc; }
</style>

<div class="container">
<div class="card" style="background-image:url('https://via.placeholder.com/600')">
  <div class="overlay">
    <h2>🔥 Breaking News</h2>
    <p>Multiple injuries reported in Carrollton Koreatown shooting...</p>
  </div>
</div>

<div class="card" style="background-image:url('https://via.placeholder.com/600')">
  <div class="overlay">
    <h2>🌍 World News</h2>
    <p>Car ploughs into crowd in Germany; 2 dead, 22 injured...</p>
  </div>
</div>
<button onclick="shareNews()">Share</button>

<script>
function shareNews(){
  if(navigator.share){
    navigator.share({
      title: "Flash News",
      url: window.location.href
    });
  }
}
</script>
</div>
<script>
setInterval(()=>{
  location.reload();
}, 60000); // every 1 min refresh
</script>
</body>
</html>
