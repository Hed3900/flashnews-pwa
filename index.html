<!DOCTYPE html>
<html>
<head>
  <meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  overflow: hidden;
}

.container {
  display: flex;
  overflow-x: scroll;
  height: 100vh;
  scroll-snap-type: x mandatory;
}

.card {
  min-width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 20px;
  box-sizing: border-box;
  scroll-snap-align: start;
  background-size: cover;
  background-position: center;
}

.overlay {
  background: linear-gradient(transparent, black);
  padding: 20px;
  border-radius: 10px;
}

h2 { font-size: 22px; }
p { color: #ccc; }
</style>

<div class="container">
<div class="hero-news">
  <div class="hero-main">
    <img src="https://images.unsplash.com/photo-1504711434969-e33886168f5c"/>
    <h2>🚨 Breaking: Major Incident Shocks City</h2>
  </div>

  <div class="hero-side">
    <p>👉 Texas Shooting Updates</p>
    <p>👉 Global News Highlights</p>
    <p>👉 Trending Stories Today</p>
  </div>
</div>

<style>
.hero-news {
  display: flex;
  gap: 10px;
  margin: 10px 0;
}
.hero-main {
  width: 65%;
}
.hero-main img {
  width: 100%;
  height: auto;
  border-radius: 8px;
}
.hero-main h2 {
  font-size: 18px;
  margin-top: 8px;
}
.hero-side {
  width: 35%;
}
.hero-side p {
  background: #fff;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 6px;
  border: 1px solid #eee;
}
@media(max-width:768px){
  .hero-news {
    flex-direction: column;
  }
  .hero-main, .hero-side {
    width: 100%;
  }
}
</style>
<div class="card" style="background-image:url('https://via.placeholder.com/600')">
  <div class="overlay">
    <h2>🔥 Breaking News</h2>
    <p>Multiple injuries reported in Carrollton Koreatown shooting...</p>
  </div>
</div>

<div class="card" style="background-image:url('https://via.placeholder.com/600')">
  <div class="overlay">
    <h2>🌍 World News</h2>
    <p>Car ploughs into crowd in Germany; 2 dead, 22 injured...</p>
  </div>
</div>
<button onclick="shareNews()">Share</button>

<script>
function shareNews(){
  if(navigator.share){
    navigator.share({
      title: "Flash News",
      url: window.location.href
    });
  }
}
</script>
</div>
<script>
setInterval(()=>{
  location.reload();
}, 60000); // every 1 min refresh
</script>
</body>
</html>
